# LabQubit on Docker: Frappe v15 + the labqubit app, MariaDB, Redis, nginx.
# Adapted from frappe_docker's pwd.yml.
#
#   cp .env.example .env      # then set real passwords
#   docker compose build
#   docker compose up -d
#   open http://localhost:8080

name: labqubit

x-app: &app
  image: labqubit:local
  pull_policy: never # built locally by `docker compose build`, never pulled
  networks:
    - frappe_network
  restart: unless-stopped
  volumes:
    - sites:/home/frappe/frappe-bench/sites
    - logs:/home/frappe/frappe-bench/logs

x-after-config: &after-config
  depends_on:
    configurator:
      condition: service_completed_successfully

services:
  backend:
    <<: [*app, *after-config]
    build:
      context: .
      dockerfile: docker/Dockerfile

  # Writes DB and Redis hosts into common_site_config.json
  configurator:
    <<: *app
    restart: "no"
    entrypoint: ["bash", "-c"]
    command:
      - |
        set -e
        ls -1 apps > sites/apps.txt
        bench set-config -g db_host db
        bench set-config -gp db_port 3306
        bench set-config -g redis_cache "redis://redis-cache:6379"
        bench set-config -g redis_queue "redis://redis-queue:6379"
        bench set-config -g redis_socketio "redis://redis-queue:6379"
        bench set-config -gp socketio_port 9000
    depends_on:
      db:
        condition: service_healthy

  # First run: creates the site, installs labqubit and seeds starter content (SEED_DEMO=0 to skip).
  # Later runs: migrates it.
  create-site:
    <<: [*app, *after-config]
    restart: "no"
    entrypoint: ["bash", "-c"]
    environment:
      SITE_NAME: ${SITE_NAME:-labqubit.localhost}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
      SEED_DEMO: ${SEED_DEMO:-1}
    command:
      - |
        set -e
        wait-for-it -t 120 db:3306
        wait-for-it -t 120 redis-cache:6379
        wait-for-it -t 120 redis-queue:6379
        if [ -d "sites/$$SITE_NAME" ]; then
          echo "Site $$SITE_NAME exists, running migrate"
          bench --site "$$SITE_NAME" migrate
        else
          bench new-site "$$SITE_NAME" \
            --mariadb-user-host-login-scope='%' \
            --db-root-username=root \
            --db-root-password="$$DB_ROOT_PASSWORD" \
            --admin-password="$$ADMIN_PASSWORD" \
            --install-app labqubit \
            --set-default
          if [ "$$SEED_DEMO" = "1" ]; then
            bench --site "$$SITE_NAME" execute labqubit.setup.demo.create_demo_content
          fi
        fi
        if [ -n "$${DOMAIN:-}" ]; then
          bench --site "$$SITE_NAME" set-config host_name "https://$$DOMAIN"
        fi

  db:
    image: mariadb:10.11
    networks:
      - frappe_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 10
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/mysql

  # nginx: serves /assets and proxies everything else to backend and websocket
  frontend:
    <<: *app
    command: ["nginx-entrypoint.sh"]
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      FRAPPE_SITE_NAME_HEADER: ${SITE_NAME:-labqubit.localhost}
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 50m
    ports:
      - "${HTTP_PORT:-8080}:8080"
    depends_on:
      - backend
      - websocket

  websocket:
    <<: [*app, *after-config]
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]

  queue-short:
    <<: [*app, *after-config]
    command: ["bench", "worker", "--queue", "short,default"]

  queue-long:
    <<: [*app, *after-config]
    command: ["bench", "worker", "--queue", "long,default,short"]

  scheduler:
    <<: [*app, *after-config]
    command: ["bench", "schedule"]

  redis-cache:
    image: redis:6.2-alpine
    networks:
      - frappe_network
    restart: unless-stopped

  redis-queue:
    image: redis:6.2-alpine
    networks:
      - frappe_network
    restart: unless-stopped
    volumes:
      - redis-queue-data:/data

volumes:
  db-data:
  redis-queue-data:
  sites:
  logs:

networks:
  frappe_network:
    driver: bridge
